<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="personalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2ecc71;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#personalGrad)"/>
  <g opacity="0.3" fill="#fff">
    <!-- Trainer figure -->
    <circle cx="300" cy="200" r="40"/>
    <rect x="275" y="250" width="50" height="80" rx="10"/>
    <rect x="265" y="260" width="20" height="60" rx="5"/>
    <rect x="315" y="260" width="20" height="60" rx="5"/>
    <rect x="275" y="335" width="20" height="70" rx="5"/>
    <rect x="305" y="335" width="20" height="70" rx="5"/>
    <!-- Client figure -->
    <circle cx="500" cy="220" r="35"/>
    <rect x="478" y="265" width="44" height="70" rx="8"/>
    <rect x="470" y="275" width="18" height="50" rx="4"/>
    <rect x="512" y="275" width="18" height="50" rx="4"/>
    <rect x="478" y="340" width="18" height="60" rx="4"/>
    <rect x="504" y="340" width="18" height="60" rx="4"/>
    <!-- Clipboard -->
    <rect x="350" y="240" width="80" height="100" rx="5" fill="#fff"/>
    <rect x="350" y="230" width="80" height="20" rx="5" fill="#e31e24"/>
    <line x1="370" y1="265" x2="410" y2="265" stroke="#333" stroke-width="3"/>
    <line x1="370" y1="285" x2="410" y2="285" stroke="#333" stroke-width="3"/>
    <line x1="370" y1="305" x2="410" y2="305" stroke="#333" stroke-width="3"/>
  </g>
</svg>
