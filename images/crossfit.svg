<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="crossfitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d35400;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#crossfitGrad)"/>
  <g opacity="0.3" fill="#fff">
    <!-- Kettlebell -->
    <circle cx="250" cy="320" r="70"/>
    <rect x="235" y="230" width="30" height="50" rx="5"/>
    <path d="M 215 230 Q 250 210 285 230" stroke="#fff" stroke-width="12" fill="none" stroke-linecap="round"/>
    <!-- Box jump box -->
    <rect x="420" y="300" width="180" height="140" rx="5"/>
    <rect x="420" y="300" width="180" height="20" fill="#e31e24"/>
    <!-- Rope -->
    <path d="M 680 150 Q 690 200 680 250 Q 670 300 680 350 Q 690 400 680 450"
          stroke="#fff" stroke-width="15" fill="none" stroke-linecap="round"/>
    <circle cx="680" cy="120" r="25"/>
  </g>
</svg>
