<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d2d2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a1a;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(227,30,36,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#heroGrad)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <g opacity="0.15">
    <!-- Dumbbell icon -->
    <circle cx="800" cy="400" r="60" fill="#e31e24"/>
    <rect x="850" y="390" width="220" height="20" fill="#e31e24"/>
    <circle cx="1080" cy="400" r="60" fill="#e31e24"/>
    <!-- Barbell -->
    <rect x="600" y="640" width="720" height="20" fill="#e31e24"/>
    <rect x="590" y="610" width="30" height="80" fill="#e31e24"/>
    <rect x="1300" y="610" width="30" height="80" fill="#e31e24"/>
    <circle cx="560" cy="650" r="50" fill="#e31e24"/>
    <circle cx="1360" cy="650" r="50" fill="#e31e24"/>
  </g>
</svg>
