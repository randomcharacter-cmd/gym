<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="cardioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0392b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#cardioGrad)"/>
  <g opacity="0.3">
    <!-- Heart rate line -->
    <path d="M 50 300 L 150 300 L 200 200 L 250 400 L 300 250 L 350 300 L 750 300"
          stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Heart -->
    <path d="M 400 180 C 400 160 380 140 360 140 C 340 140 320 155 320 175 C 320 155 300 140 280 140 C 260 140 240 160 240 180 C 240 220 320 280 320 280 C 320 280 400 220 400 180 Z"
          fill="#fff" transform="translate(180, 80) scale(1.5)"/>
  </g>
</svg>
