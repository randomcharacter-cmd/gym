<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="nutritionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#16a085;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1abc9c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#nutritionGrad)"/>
  <g opacity="0.3" fill="#fff">
    <!-- Plate -->
    <circle cx="400" cy="300" r="150" stroke="#fff" stroke-width="8" fill="none"/>
    <circle cx="400" cy="300" r="160" stroke="#fff" stroke-width="3" fill="none"/>
    <!-- Apple -->
    <circle cx="320" cy="280" r="35"/>
    <path d="M 320 245 Q 315 230 320 220" stroke="#2ecc71" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 320 220 Q 310 215 305 220 Q 310 225 320 220 Q 330 225 335 220 Q 330 215 320 220"
          fill="#2ecc71"/>
    <!-- Broccoli -->
    <circle cx="420" cy="320" r="25"/>
    <circle cx="440" cy="310" r="22"/>
    <circle cx="405" cy="305" r="20"/>
    <rect x="415" y="340" width="10" height="30" rx="2" fill="#2ecc71"/>
    <!-- Carrot -->
    <path d="M 480 260 L 500 340 L 485 340 Z" fill="#e67e22"/>
    <path d="M 490 255 L 485 240 M 492 257 L 495 242 M 488 257 L 483 242"
          stroke="#2ecc71" stroke-width="3" stroke-linecap="round"/>
    <!-- Fork and Knife -->
    <g transform="translate(580, 200)">
      <rect x="0" y="40" width="6" height="100" rx="2"/>
      <line x1="3" y1="0" x2="3" y2="45" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
      <line x1="-8" y1="0" x2="-8" y2="35" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <line x1="14" y1="0" x2="14" y2="35" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(630, 200)">
      <rect x="0" y="0" width="6" height="140" rx="2"/>
      <path d="M 0 0 L -15 20 L 0 30 Z"/>
    </g>
  </g>
</svg>
